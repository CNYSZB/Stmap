<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>体积云生成器 · 稳定版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #080c14; font-family: 'Segoe UI', system-ui, sans-serif; color: #d0dce8; overflow: hidden; height: 100vh; user-select: none; }
        #container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #controls {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(8,12,20,0.82); backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;
            padding: 14px 20px 18px 20px; min-width: 320px; max-width: 520px; width: 90%;
            box-shadow: 0 8px 48px rgba(0,0,0,0.7); display: flex; flex-direction: column; gap: 7px;
        }
        #controls .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #controls .row .label { font-size: 12px; font-weight: 500; min-width: 40px; color: #8aa4c8; }
        #controls .row .value { font-size: 12px; font-weight: 600; min-width: 36px; text-align: right; color: #c4d4ec; font-variant-numeric: tabular-nums; }
        input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #1a2a44, #4a7ab8); outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #6a9ee0; cursor: grab; border: 2px solid #12202e; box-shadow: 0 0 12px rgba(106,158,224,0.2); transition: 0.1s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
        input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #6a9ee0; cursor: grab; border: 2px solid #12202e; }
        .btn-group { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
        .btn { padding: 6px 14px; border: none; border-radius: 9px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.05); color: #b0c4dc; border: 1px solid rgba(255,255,255,0.07); flex: 1; min-width: 60px; text-align: center; }
        .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-primary { background: #2a6ab8; color: #fff; border-color: #3a7ac8; }
        .btn-primary:hover { background: #3a7ac8; box-shadow: 0 0 20px rgba(58,122,200,0.25); }
        .btn-danger { background: #8a2a2a; color: #fff; border-color: #aa3a3a; }
        #status {
            position: fixed; top: 12px; left: 16px; z-index: 20;
            font-size: 11px; color: rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); padding: 3px 10px; border-radius: 8px;
            max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        #fps { position: fixed; top: 12px; right: 16px; z-index: 20; font-size: 12px; color: rgba(255,255,255,0.25); font-variant-numeric: tabular-nums; background: rgba(0,0,0,0.3); padding: 3px 10px; border-radius: 8px; }
        @media (max-width: 500px) {
            #controls { bottom: 10px; padding: 10px 12px 14px 12px; min-width: unset; border-radius: 10px; gap: 5px; }
            #controls .row .label { font-size: 11px; min-width: 30px; }
            #controls .row .value { font-size: 11px; min-width: 26px; }
            .btn { font-size: 11px; padding: 4px 8px; }
            #hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="status">就绪</div>
    <div id="fps">-- FPS</div>
    <div id="controls">
        <div class="row">
            <span class="label">📐 高度</span>
            <input type="range" id="heightSlider" min="0" max="22" step="0.1" value="6" />
            <span class="value" id="heightValue">6.0</span>
        </div>
        <div class="row">
            <span class="label">🌤 时间</span>
            <input type="range" id="timeSlider" min="0" max="24" step="0.1" value="14" />
            <span class="value" id="timeValue">14:00</span>
        </div>
        <div class="row">
            <span class="label">☁ 云量</span>
            <input type="range" id="densitySlider" min="0" max="3.0" step="0.05" value="1.0" />
            <span class="value" id="densityValue">1.00</span>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="exportBtn">📷 导出天空盒</button>
            <button class="btn" id="resetBtn">⟲ 复位</button>
        </div>
    </div>

    <script type="importmap">{
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }</script>

    <script type="module">
    // ================================================================
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const status = document.getElementById('status');

    // ================================================================
    //  直接写死的着色器（不经过函数生成，减少出错）
    // ================================================================

    // ---- 主场景顶点 ----
    const mainVert = `
    varying vec3 vWorldPos;
    void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`;

    // ---- 主场景片段（直接包含所有GLSL代码，不嵌套函数） ----
    const mainFrag = `
    uniform vec3 uCameraPos;
    uniform vec3 uSunDir;
    uniform float uCloudAmount;
    uniform float uHeightOffset;

    varying vec3 vWorldPos;

    // ─── 噪声 ───
    float hash(vec3 p) {
        p = fract(p * 0.3183099 + 0.1); p *= 17.0;
        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }
    float noise(vec3 p) {
        vec3 i = floor(p); vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a=hash(i),b=hash(i+vec3(1,0,0)),c=hash(i+vec3(0,1,0)),d_=hash(i+vec3(1,1,0));
        float e=hash(i+vec3(0,0,1)),f_=hash(i+vec3(1,0,1)),g=hash(i+vec3(0,1,1)),h=hash(i+vec3(1,1,1));
        float u1=mix(mix(a,b,f.x),mix(c,d_,f.x),f.y);
        float u2=mix(mix(e,f_,f.x),mix(g,h,f.x),f.y);
        return mix(u1,u2,f.z);
    }
    float fbm(vec3 p) {
        float v=0.0,a=0.5,f=1.0;
        for(int i=0;i<4;i++){v+=a*noise(p*f);a*=0.5;f*=2.0;}
        return v;
    }

    // ─── 云密度 ───
    float cloudDensity(vec3 p, float amount) {
        p.y += uHeightOffset;
        float n1 = fbm(p * 0.12);
        vec3 warp = vec3(n1*0.18, n1*0.08, n1*0.12);
        float n2 = fbm((p + warp) * 0.28 + 1.7);
        float n3 = fbm((p + warp*0.6) * 0.35 + 0.5);
        float d = 0.0;

        // 主云层
        {
            float h = smoothstep(3.0,5.0,p.y)*(1.0-smoothstep(9.5,11.5,p.y));
            float hf = max(1.0-abs((p.y-7.0)/4.0),0.0);
            float th = 0.65 - amount * 0.18;
            th = clamp(th, 0.08, 0.65);
            float shape = smoothstep(th, th+0.14, n1);
            float detail = (n2-0.5)*0.4 + (n3-0.5)*0.25;
            shape = clamp(shape + detail, 0.0, 1.0);
            float thick = 0.3 + amount * 0.6;
            d += shape * h * hf * thick;
        }
        // 底层
        {
            float h = smoothstep(0.4,1.8,p.y)*(1.0-smoothstep(3.8,5.2,p.y));
            float th = 0.60 - amount * 0.13;
            th = clamp(th, 0.15, 0.60);
            float v = smoothstep(th, th+0.12, n2*0.6+0.2);
            d += v * h * (0.10 + amount * 0.10);
        }
        // 高层
        {
            float h = smoothstep(9.5,11.0,p.y)*(1.0-smoothstep(14.5,16.5,p.y));
            float th = 0.62 - amount * 0.12;
            th = clamp(th, 0.20, 0.62);
            float v = smoothstep(th, th+0.12, n2*0.7+n1*0.2);
            d += v * h * (0.08 + amount * 0.07);
        }
        return d;
    }

    // ─── 光照采样 ───
    float sunLight(vec3 pos, vec3 sDir, float amount) {
        float dens=0.0;
        for(int i=0;i<4;i++){pos+=sDir*2.0; dens+=cloudDensity(pos,amount)*2.0;}
        float trans=exp(-dens*0.30);
        trans = trans*0.50 + 0.50*(1.0-exp(-dens*0.08));
        return trans;
    }

    float phase(float ct) {
        float g=0.78, gg=g*g;
        return (1.0-gg)/(4.0*3.14159265*pow(1.0+gg-2.0*g*ct,1.5));
    }

    vec3 skyBG(vec3 rd, vec3 sd) {
        float se=sd.y, ct=dot(rd,sd);
        vec3 sky=mix(vec3(0.06,0.12,0.35),vec3(0.20,0.40,0.76),0.45+0.55*max(rd.y,0.0));
        sky=mix(sky,mix(vec3(0.68,0.58,0.42),vec3(0.86,0.70,0.48),0.5+0.5*se),pow(1.0-abs(rd.y),1.6)*0.45);
        sky+=pow(max(ct,0.0),60.0+max(0.0,se)*40.0)*mix(vec3(0.95,0.58,0.18),vec3(1.0,0.95,0.80),clamp(se*2.0,0.0,1.0))*0.40;
        if(se<0.15){float w=(0.15-se)/0.15; sky=mix(sky,vec3(0.78,0.38,0.10),w*0.50); sky=mix(sky,vec3(0.90,0.48,0.16),w*0.25*max(ct,0.0));}
        sky=mix(sky,vec3(0.010,0.020,0.05),pow(max(-rd.y,0.0),2.0)*0.25);
        return sky;
    }

    // ─── 主循环 ───
    void main() {
        vec3 ro = uCameraPos;
        vec3 rd = normalize(vWorldPos - ro);
        ro += rd * 0.5;

        const int STEPS = 48;
        const float MAX_DIST = 160.0;
        float stepSize = MAX_DIST / float(STEPS);

        vec3 pos = ro;
        float trans = 1.0;
        vec3 color = vec3(0.0);
        float totalD = 0.0;

        vec3 skyBg = skyBG(rd, uSunDir);
        float se = uSunDir.y;
        vec3 sunCol = mix(vec3(2.8,1.4,0.30), vec3(2.8,2.6,2.4), clamp(se*2.0+0.2,0.0,1.0));

        for (int i = 0; i < STEPS; i++) {
            pos += rd * stepSize;
            if (length(pos - ro) > MAX_DIST) break;

            float d = cloudDensity(pos, uCloudAmount);
            if (d > 0.003) {
                float opt = d * stepSize * 0.50;
                totalD += opt;

                float sunTrans = sunLight(pos, uSunDir, uCloudAmount);
                float ct = dot(rd, uSunDir);
                float pv = phase(ct);

                float face = ct * 0.5 + 0.5;
                vec3 cloudColor = mix(vec3(0.70,0.73,0.82), vec3(1.00,0.98,0.94), face);
                float thick = 1.0 - exp(-totalD * 0.25);
                cloudColor = mix(cloudColor, vec3(0.78,0.80,0.86), thick * 0.25);

                float directLight = pv * 3.0 + 0.08;
                float ambFactor = 0.10 + 0.18 * (1.0 - exp(-totalD * 0.2));
                vec3 lighting = sunCol * directLight + skyBg * ambFactor;

                color += cloudColor * lighting * d * stepSize * trans * 1.0;
                trans *= exp(-opt * 1.0);

                if (trans < 0.003 || totalD > 10.0) break;
            }
        }

        vec3 finalColor = skyBg * trans + color;
        finalColor = mix(finalColor, skyBg * 0.7, pow(1.0 - abs(rd.y), 2.0) * 0.08);

        gl_FragColor = vec4(finalColor, 1.0);
    }`;

    // ---- 导出片段（独立，使用 uHeightOffset 偏移云层） ----
    const exportFrag = `
    uniform vec3 uSunDir;
    uniform float uCloudAmount;
    uniform float uHeightOffset;

    varying vec2 vUv;

    // ─── 噪声 ───
    float hash(vec3 p) {
        p = fract(p * 0.3183099 + 0.1); p *= 17.0;
        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
    }
    float noise(vec3 p) {
        vec3 i = floor(p); vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a=hash(i),b=hash(i+vec3(1,0,0)),c=hash(i+vec3(0,1,0)),d_=hash(i+vec3(1,1,0));
        float e=hash(i+vec3(0,0,1)),f_=hash(i+vec3(1,0,1)),g=hash(i+vec3(0,1,1)),h=hash(i+vec3(1,1,1));
        float u1=mix(mix(a,b,f.x),mix(c,d_,f.x),f.y);
        float u2=mix(mix(e,f_,f.x),mix(g,h,f.x),f.y);
        return mix(u1,u2,f.z);
    }
    float fbm(vec3 p) {
        float v=0.0,a=0.5,f=1.0;
        for(int i=0;i<4;i++){v+=a*noise(p*f);a*=0.5;f*=2.0;}
        return v;
    }

    float cloudDensity(vec3 p, float amount) {
        p.y += uHeightOffset;
        float n1 = fbm(p * 0.12);
        vec3 warp = vec3(n1*0.18, n1*0.08, n1*0.12);
        float n2 = fbm((p + warp) * 0.28 + 1.7);
        float n3 = fbm((p + warp*0.6) * 0.35 + 0.5);
        float d = 0.0;
        {
            float h = smoothstep(3.0,5.0,p.y)*(1.0-smoothstep(9.5,11.5,p.y));
            float hf = max(1.0-abs((p.y-7.0)/4.0),0.0);
            float th = 0.65 - amount * 0.18; th = clamp(th, 0.08, 0.65);
            float shape = smoothstep(th, th+0.14, n1);
            float detail = (n2-0.5)*0.4 + (n3-0.5)*0.25;
            shape = clamp(shape + detail, 0.0, 1.0);
            float thick = 0.3 + amount * 0.6;
            d += shape * h * hf * thick;
        }
        {
            float h = smoothstep(0.4,1.8,p.y)*(1.0-smoothstep(3.8,5.2,p.y));
            float th = 0.60 - amount * 0.13; th = clamp(th, 0.15, 0.60);
            float v = smoothstep(th, th+0.12, n2*0.6+0.2);
            d += v * h * (0.10 + amount * 0.10);
        }
        {
            float h = smoothstep(9.5,11.0,p.y)*(1.0-smoothstep(14.5,16.5,p.y));
            float th = 0.62 - amount * 0.12; th = clamp(th, 0.20, 0.62);
            float v = smoothstep(th, th+0.12, n2*0.7+n1*0.2);
            d += v * h * (0.08 + amount * 0.07);
        }
        return d;
    }

    float sunLight(vec3 pos, vec3 sDir, float amount) {
        float dens=0.0;
        for(int i=0;i<4;i++){pos+=sDir*2.0; dens+=cloudDensity(pos,amount)*2.0;}
        float trans=exp(-dens*0.30);
        trans = trans*0.50 + 0.50*(1.0-exp(-dens*0.08));
        return trans;
    }

    float phase(float ct) { float g=0.78,gg=g*g; return (1.0-gg)/(4.0*3.14159265*pow(1.0+gg-2.0*g*ct,1.5)); }

    vec3 skyBG(vec3 rd, vec3 sd) {
        float se=sd.y, ct=dot(rd,sd);
        vec3 sky=mix(vec3(0.06,0.12,0.35),vec3(0.20,0.40,0.76),0.45+0.55*max(rd.y,0.0));
        sky=mix(sky,mix(vec3(0.68,0.58,0.42),vec3(0.86,0.70,0.48),0.5+0.5*se),pow(1.0-abs(rd.y),1.6)*0.45);
        sky+=pow(max(ct,0.0),60.0+max(0.0,se)*40.0)*mix(vec3(0.95,0.58,0.18),vec3(1.0,0.95,0.80),clamp(se*2.0,0.0,1.0))*0.40;
        if(se<0.15){float w=(0.15-se)/0.15; sky=mix(sky,vec3(0.78,0.38,0.10),w*0.50); sky=mix(sky,vec3(0.90,0.48,0.16),w*0.25*max(ct,0.0));}
        sky=mix(sky,vec3(0.010,0.020,0.05),pow(max(-rd.y,0.0),2.0)*0.25);
        return sky;
    }

    void main() {
        float theta = vUv.x * 6.2831853;
        float phi   = vUv.y * 3.14159265;
        vec3 rd;
        rd.x = sin(phi) * cos(theta);
        rd.y = cos(phi);
        rd.z = sin(phi) * sin(theta);

        vec3 ro = vec3(0.0);

        const int STEPS = 64;
        const float MAX_DIST = 200.0;
        float stepSize = MAX_DIST / float(STEPS);

        vec3 pos = ro;
        float trans = 1.0;
        vec3 color = vec3(0.0);
        float totalD = 0.0;

        vec3 skyBg = skyBG(rd, uSunDir);
        float se = uSunDir.y;
        vec3 sunCol = mix(vec3(2.8,1.4,0.30), vec3(2.8,2.6,2.4), clamp(se*2.0+0.2,0.0,1.0));

        for (int i = 0; i < STEPS; i++) {
            pos += rd * stepSize;
            if (length(pos - ro) > MAX_DIST) break;

            float d = cloudDensity(pos, uCloudAmount);
            if (d > 0.003) {
                float opt = d * stepSize * 0.50;
                totalD += opt;

                float sunTrans = sunLight(pos, uSunDir, uCloudAmount);
                float ct = dot(rd, uSunDir);
                float pv = phase(ct);

                float face = ct * 0.5 + 0.5;
                vec3 cloudColor = mix(vec3(0.70,0.73,0.82), vec3(1.00,0.98,0.94), face);
                float thick = 1.0 - exp(-totalD * 0.25);
                cloudColor = mix(cloudColor, vec3(0.78,0.80,0.86), thick * 0.25);

                float directLight = pv * 3.0 + 0.08;
                float ambFactor = 0.10 + 0.18 * (1.0 - exp(-totalD * 0.2));
                vec3 lighting = sunCol * directLight + skyBg * ambFactor;

                color += cloudColor * lighting * d * stepSize * trans * 1.0;
                trans *= exp(-opt * 1.0);

                if (trans < 0.003 || totalD > 10.0) break;
            }
        }

        vec3 finalColor = skyBg * trans + color;
        finalColor = mix(finalColor, skyBg * 0.7, pow(1.0 - abs(rd.y), 2.0) * 0.08);

        gl_FragColor = vec4(finalColor, 1.0);
    }`;

    // ================================================================
    //  场景初始化
    // ================================================================
    const container = document.getElementById('container');
    const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance',
        // 导出时需要 preserveDrawingBuffer
        preserveDrawingBuffer: true,
    });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(70,
        container.clientWidth / container.clientHeight, 0.1, 600);
    camera.position.set(0, 6, 10);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4.2, 0);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 1.5; controls.maxDistance = 45;
    controls.maxPolarAngle = 1.55; controls.update();

    const scene = new THREE.Scene();
    const P = { height: 6.0, time: 14.0, cloudAmount: 1.0 };

    function calcSunDir(time) {
        const angle = (time/24.0)*6.2831853-1.5708;
        const elev = Math.max(Math.sin((time-6.0)/12.0*3.14159265)*1.2, -0.35);
        return new THREE.Vector3(
            Math.cos(angle)*Math.cos(elev),
            Math.sin(elev),
            Math.sin(angle)*Math.cos(elev)
        ).normalize();
    }
    let sunDir = calcSunDir(P.time);

    // 尝试编译着色器，如果失败则显示错误
    const U = {
        uCameraPos: { value: camera.position.clone() },
        uSunDir: { value: sunDir.clone() },
        uCloudAmount: { value: P.cloudAmount },
        uHeightOffset: { value: 0.0 },
    };

    const cloudMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: U,
        vertexShader: mainVert,
        fragmentShader: mainFrag,
        depthWrite: false,
    });

    // 检测着色器编译错误
    if (cloudMat.material) {
        // ShaderMaterial 没有直接的编译检测，但 Three.js 会报 warning
    }

    scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 48, 48), cloudMat));
    const grid = new THREE.GridHelper(40, 20, 0x2a4a6a, 0x142232);
    grid.position.y = -0.1; scene.add(grid);

    status.textContent = '场景已加载 · ' + renderer.info.render.triangles + ' 三角';

    // ================================================================
    //  控制
    // ================================================================
    const $ = id => document.getElementById(id);
    const hs = $('heightSlider'), hv = $('heightValue');
    const ts = $('timeSlider'), tv = $('timeValue');
    const ds = $('densitySlider'), dv = $('densityValue');
    const eb = $('exportBtn'), rb = $('resetBtn');

    function upd() {
        const h = parseFloat(hs.value), t = parseFloat(ts.value), a = parseFloat(ds.value);
        P.height = h; P.time = t; P.cloudAmount = a;
        camera.position.y = h; controls.target.y = h * 0.7; controls.update();
        sunDir = calcSunDir(t);
        U.uSunDir.value.copy(sunDir);
        U.uCameraPos.value.copy(camera.position);
        U.uCloudAmount.value = a;
        hv.textContent = h.toFixed(1);
        const hrs = Math.floor(t), min = Math.floor((t-hrs)*60);
        tv.textContent = hrs.toString().padStart(2,'0') + ':' + min.toString().padStart(2,'0');
        dv.textContent = a.toFixed(2);
    }
    hs.addEventListener('input', upd);
    ts.addEventListener('input', upd);
    ds.addEventListener('input', upd);
    rb.addEventListener('click', () => {
        camera.position.set(0, P.height, 10);
        controls.target.set(0, P.height * 0.7, 0);
        controls.update();
        U.uCameraPos.value.copy(camera.position);
    });

    // ================================================================
    //  导出 ★ 使用主渲染器 + 离屏目标，不创建额外渲染器 ★
    // ================================================================
    eb.addEventListener('click', async () => {
        eb.textContent = '⏳ 导出中 ...';
        eb.disabled = true;
        status.textContent = '导出渲染中 ...';
        await new Promise(r => setTimeout(r, 30));

        try {
            const W = 2048, H = 1024; // 降低分辨率提高稳定性

            // 创建离屏目标
            const rt = new THREE.WebGLRenderTarget(W, H, {
                format: THREE.RGBAFormat,
                type: THREE.UnsignedByteType,
                colorSpace: THREE.SRGBColorSpace,
                depthBuffer: false,
                stencilBuffer: false,
            });

            // 导出场景
            const expScene = new THREE.Scene();
            const expCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
            expCam.position.set(0, 0, 1);
            expCam.lookAt(0, 0, 0);
            expCam.updateMatrixWorld(true);

            const eU = {
                uSunDir: { value: sunDir.clone() },
                uCloudAmount: { value: P.cloudAmount },
                uHeightOffset: { value: P.height },
            };
            const eM = new THREE.ShaderMaterial({
                uniforms: eU,
                vertexShader: 'varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position,1.0);}',
                fragmentShader: exportFrag,
                depthWrite: false,
                depthTest: false,
            });
            expScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), eM));

            // 保存当前渲染状态
            const prevRt = renderer.getRenderTarget();
            const prevSize = new THREE.Vector2();
            renderer.getSize(prevSize);

            // 渲染到离屏目标
            renderer.setRenderTarget(rt);
            renderer.render(expScene, expCam);
            renderer.setRenderTarget(prevRt);

            // 读取像素
            const pixels = new Uint8Array(W * H * 4);
            renderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);

            // 检查是否有有效像素
            let hasContent = false;
            for (let i = 0; i < pixels.length; i += 4) {
                if (pixels[i] > 10 || pixels[i+1] > 10 || pixels[i+2] > 10) {
                    hasContent = true;
                    break;
                }
            }

            if (!hasContent) {
                throw new Error('导出图像全黑或全白，请重试');
            }

            // 翻转 Y 轴并写入 Canvas
            const canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(W, H);

            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const src = (y * W + x) * 4;
                    const dst = ((H - 1 - y) * W + x) * 4;
                    imgData.data[dst]     = pixels[src];
                    imgData.data[dst + 1] = pixels[src + 1];
                    imgData.data[dst + 2] = pixels[src + 2];
                    imgData.data[dst + 3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);

            // 下载
            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'skybox_h' + P.height.toFixed(1) + '_t' + P.time.toFixed(1) + '.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            // 清理
            rt.dispose();
            eM.dispose();

            eb.textContent = '✅ 已导出';
            status.textContent = '导出成功';
            setTimeout(() => {
                eb.textContent = '📷 导出天空盒';
                eb.disabled = false;
            }, 2000);
        } catch (err) {
            console.error('导出失败:', err);
            eb.textContent = '❌ 失败: ' + err.message;
            status.textContent = '导出失败: ' + err.message;
            setTimeout(() => {
                eb.textContent = '📷 导出天空盒';
                eb.disabled = false;
            }, 3000);
        }
    });

    // ================================================================
    //  动画
    // ================================================================
    const fpsEl = document.getElementById('fps');
    let frames = 0, lastFpsTime = 0;

    window.addEventListener('resize', () => {
        const w = container.clientWidth, h = container.clientHeight;
        camera.aspect = w / h; camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    });

    function animate(time) {
        requestAnimationFrame(animate);
        controls.update();
        U.uCameraPos.value.copy(camera.position);
        renderer.render(scene, camera);
        frames++;
        if (time - lastFpsTime >= 1000) {
            fpsEl.textContent = frames + ' FPS';
            // 如果 FPS 极低，提示
            if (frames < 15) {
                status.textContent = '性能偏低，可降低像素比或步数';
            }
            frames = 0;
            lastFpsTime = time;
        }
    }

    upd();
    animate(0);
    console.log('☁️ 稳定版已启动');
    </script>
</body>
</html>
