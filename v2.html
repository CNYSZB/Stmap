<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>行星v2 · 分屏优化</title>
    <style>
        :root {
            --accent: #00e5ff;
            --menu-bg: rgba(20, 20, 20, 0.92);
            --panel-border: rgba(255, 255, 255, 0.15);
            --text-dim: #9aa0a6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0a0a0c;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 上半部分：星球预览区 */
        #preview-area {
            position: relative;
            flex: 1 1 55%;
            min-height: 0;
            background: radial-gradient(circle at 50% 30%, #12121a 0%, #050508 80%);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            border-bottom: 2px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        #preview-area:active {
            cursor: grabbing;
        }

        /* 下半部分：菜单区 (常驻展开，直接可见) */
        #menu-section {
            flex: 0 0 auto;
            height: 42vh;
            min-height: 260px;
            max-height: 55vh;
            background: var(--menu-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding: 12px 16px 16px 16px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
            z-index: 50;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        #menu-section::-webkit-scrollbar {
            width: 4px;
        }
        #menu-section::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .menu-title {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            color: #eaeaea;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-title i {
            font-style: normal;
            color: var(--accent);
            font-size: 18px;
        }
        .seed-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.4);
            border-radius: 40px;
            padding: 6px 8px;
            flex-shrink: 0;
        }
        .seed-row input[type="number"] {
            flex: 1;
            background: #1c1c1e;
            border: 1px solid #3a3a3c;
            color: var(--accent);
            padding: 10px 12px;
            border-radius: 32px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 14px;
            text-align: center;
            outline: none;
            width: 100%;
        }
        .seed-row button {
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 32px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,229,255,0.3);
        }
        .seed-row button:active {
            transform: scale(0.96);
            background: #00b8d4;
        }

        .sliders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px 12px;
            flex: 1;
            align-content: flex-start;
        }
        .slider-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
            color: #b0b3b8;
            margin-bottom: 2px;
        }
        .slider-header label {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        .slider-header input[type="number"] {
            background: #1e1e20;
            border: 1px solid #3d3d40;
            color: white;
            padding: 4px 6px;
            border-radius: 6px;
            width: 50px;
            font-size: 12px;
            text-align: center;
            font-family: monospace;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: #2c2c2e;
            border-radius: 10px;
            outline: none;
            margin-top: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: white;
            border: 2px solid var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        input[type="range"]:active::-webkit-slider-thumb {
            background: var(--accent);
        }

        .export-strip {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
            justify-content: flex-start;
            flex-shrink: 0;
        }
        .export-btn {
            background: #2a2a2c;
            border: 1px solid #4a4a4d;
            color: #eee;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 500;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .export-btn:hover {
            background: #3a3a3d;
            border-color: var(--accent);
            color: white;
        }
        .export-btn:active {
            transform: scale(0.96);
            background: var(--accent);
            color: #000;
        }

        #toast {
            position: fixed;
            bottom: 45%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            color: #000;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            z-index: 2000;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="toast">贴图已导出</div>

    <!-- 上半部分：星球预览区 (画布将自动附加于此) -->
    <div id="preview-area"></div>

    <!-- 下半部分：菜单区 (全部展开，直接可见) -->
    <div id="menu-section">
        <div class="menu-header">
            <span class="menu-title"><i>◉</i> 星球参数</span>
            <span style="font-size:11px; color:#888;">实时预览</span>
        </div>

        <!-- 种子行 -->
        <div class="seed-row">
            <input type="number" id="seedIn" value="40662" min="0" max="999999999999">
            <button id="btn-rand">🎲 随机</button>
        </div>

        <!-- 滑块网格 -->
        <div class="sliders-grid">
            <div class="slider-item">
                <div class="slider-header"><label>海平面</label><input type="number" id="seaVal" value="48" min="0" max="100"></div>
                <input type="range" id="seaIn" min="0" max="100" value="48">
            </div>
            <div class="slider-item">
                <div class="slider-header"><label>云层密度</label><input type="number" id="cloudVal" value="50" min="0" max="100"></div>
                <input type="range" id="cloudIn" min="0" max="100" value="50">
            </div>
            <div class="slider-item">
                <div class="slider-header"><label>赤道沙漠化</label><input type="number" id="eqDesertVal" value="30" min="0" max="100"></div>
                <input type="range" id="eqDesertIn" min="0" max="100" value="30">
            </div>
            <div class="slider-item">
                <div class="slider-header"><label>北极冰盖</label><input type="number" id="iceNVal" value="40" min="0" max="160"></div>
                <input type="range" id="iceNIn" min="0" max="160" value="40">
            </div>
            <div class="slider-item">
                <div class="slider-header"><label>南极冰盖</label><input type="number" id="iceSVal" value="40" min="0" max="160"></div>
                <input type="range" id="iceSIn" min="0" max="160" value="40">
            </div>
            <div class="slider-item">
                <div class="slider-header"><label>北极浮冰</label><input type="number" id="iceNFlVal" value="20" min="0" max="160"></div>
                <input type="range" id="iceNFlIn" min="0" max="160" value="20">
            </div>
            <div class="slider-item">
                <div class="slider-header"><label>南极浮冰</label><input type="number" id="iceSFlVal" value="20" min="0" max="160"></div>
                <input type="range" id="iceSFlIn" min="0" max="160" value="20">
            </div>
            <div class="slider-item">
                <div class="slider-header"><label>大陆集中度</label><input type="number" id="landClusterVal" value="0" min="0" max="100"></div>
                <input type="range" id="landClusterIn" min="0" max="100" value="0">
            </div>
        </div>

        <!-- 导出按钮行 -->
        <div class="export-strip">
            <button class="export-btn" id="btn-geo">🌍 地形</button>
            <button class="export-btn" id="btn-hgt">🗺️ 高度图</button>
            <button class="export-btn" id="btn-cld">☁️ 云层</button>
            <button class="export-btn" id="btn-nor">🧭 法线</button>
            <button class="export-btn" id="btn-land">🏝️ 陆地</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

        // ---------- 着色器代码 (与之前相同，保持功能完整) ----------
        const noiseShader = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                vec4 j = p - 49.0 * floor(p * (1.0/49.0));
                vec4 x_ = floor(j * (1.0/7.0)); vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * (2.0/7.0) - 1.0; vec4 y = y_ * (2.0/7.0) - 1.0;
                vec4 h = 1.0 - abs(x) - abs(y); vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x); vec3 p1 = vec3(a0.zw, h.y); vec3 p2 = vec3(a1.xy, h.z); vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m; return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }
            float fbm(vec3 p, int oct, float shift) {
                float v = 0.0; float amp = 0.5;
                for (int i=0; i<8; i++) { if(i >= oct) break; v += amp * snoise(p + shift); p *= 2.15; amp *= 0.5; }
                return v;
            }
            vec4 superHash(float seed) {
                float s1 = floor(seed / 1000000.0); float s2 = mod(seed, 1000000.0);
                vec3 p3 = fract(vec3(s1, s2, seed) * vec3(.1031, .1030, .0973));
                p3 += dot(p3, p3.yzx + 33.33);
                vec3 offset = fract((p3.xxy + p3.yzz) * p3.zyx) * 2000.0;
                float phase = fract(seed * 0.01313) * 6.28;
                return vec4(offset, phase);
            }
        `;

        const planetLogic = `
            float getH(vec3 p, float uSeed, float uLandCluster, vec3 uCorePos) {
                vec4 sh = superHash(uSeed);
                vec3 sOff = sh.xyz;
                float c = cos(sh.w), s = sin(sh.w);
                p.xz *= mat2(c, -s, s, c);
                float rawH = fbm(p * 1.5 + sOff, 8, sh.w) * 0.5 + 0.5;
                float clusterStrength = uLandCluster / 100.0;
                if (clusterStrength <= 0.0) return rawH;
                float dotPC = clamp(dot(p, uCorePos), -1.0, 1.0);
                float distToCore = acos(dotPC) / 3.14159265;
                float shapeNoise1 = fbm(p * 1.5 + sOff + 999.0, 4, sh.w * 0.5) * 0.5 + 0.5;
                float shapeNoise2 = fbm(p * 3.0 + sOff + 1111.0, 3, sh.w * 0.7) * 0.5 + 0.5;
                float shapeNoise = mix(shapeNoise1, shapeNoise2, 0.5);
                float baseWeight = 1.0 - smoothstep(0.0, 0.9 + shapeNoise * 0.6, distToCore);
                float coreWeight = baseWeight * (0.5 + 0.5 * shapeNoise);
                float modulatedH = rawH + (coreWeight - 0.35) * clusterStrength * 0.8;
                return clamp(modulatedH, 0.0, 0.9);
            }

            vec3 getPlanetColor(vec3 p, float uSeed, float uSeaLevel, float uIceN, float uIceS, float uIceNFI, float uIceSFI, float uEqDesert, float uLandCluster, vec3 uCorePos) {
                vec4 sh = superHash(uSeed);
                float h = getH(p, uSeed, uLandCluster, uCorePos);
                bool isLand = h >= uSeaLevel;
                float lat = p.y;
                vec3 col;
                if(!isLand) {
                    col = mix(vec3(0.05, 0.1, 0.22), vec3(0.01, 0.03, 0.08), smoothstep(0.0, 0.7, (uSeaLevel-h)/uSeaLevel));
                } else {
                    float m = fbm(p * 2.5 + sh.xyz + 123.4, 5, sh.w * 0.5) * 0.5 + 0.5;
                    float desertStrength = uEqDesert / 100.0;
                    float areaLimit = pow(max(0.0, 1.0 - abs(lat) * 1.5), 1.8);
                    float eqFactor = desertStrength * areaLimit;
                    float finalBiomeFactor = mix(m, m * 0.15, eqFactor);
                    vec3 bio = mix(vec3(0.75,0.65,0.45), vec3(0.35,0.5,0.25), smoothstep(0.35,0.45,finalBiomeFactor));
                    bio = mix(bio, vec3(0.08,0.28,0.12), smoothstep(0.65,0.75,finalBiomeFactor));
                    col = mix(bio, vec3(0.35), smoothstep(0.45, 0.75, (h-uSeaLevel)));
                }
                vec3 iceColor = vec3(0.92, 0.95, 1.0);
                vec3 floeColor = vec3(0.70, 0.78, 0.90);
                float iceN = uIceN / 160.0;
                if (iceN > 0.0 && isLand && lat >= 1.0 - iceN + fbm(p * 4.0 + sh.xyz + 123.45, 5, sh.w) * 0.12) return iceColor;
                float floeN = uIceNFI / 160.0;
                if (floeN > 0.0 && !isLand && lat >= 1.0 - floeN + fbm(p * 4.0 + sh.xyz + 555.0, 5, sh.w) * 0.12) return floeColor;
                float iceS = uIceS / 160.0;
                if (iceS > 0.0 && isLand && lat <= -1.0 + iceS + fbm(p * 4.0 + sh.xyz + 234.56, 5, sh.w) * 0.12) return iceColor;
                float floeS = uIceSFI / 160.0;
                if (floeS > 0.0 && !isLand && lat <= -1.0 + floeS + fbm(p * 4.0 + sh.xyz + 666.0, 5, sh.w) * 0.12) return floeColor;
                return col;
            }
        `;

        // ---------- 渲染器初始化 (附加到预览区) ----------
        const previewArea = document.getElementById('preview-area');
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(previewArea.clientWidth, previewArea.clientHeight);
        previewArea.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, previewArea.clientWidth / previewArea.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);

        // 自定义 OrbitControls 添加边界限制与回弹
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;
        controls.enablePan = false;  // 禁用平移，聚焦星球
        controls.minDistance = 5.5;
        controls.maxDistance = 20;
        controls.target.set(0, 0, 0);

        // 星球模型与材质 (复用原有逻辑)
        function generateCorePos(seed) {
            const hash = (s) => { let h = s * 2654435761; h = h ^ (h >> 16); return (h & 0x7fffffff) / 0x7fffffff; };
            const lon = hash(seed) * Math.PI * 2;
            const lat = Math.asin(hash(seed + 1) * 2 - 1);
            return new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
        }

        const pMat = new THREE.ShaderMaterial({
            uniforms: { uSeed: { value: 40662 }, uSeaLevel: { value: 0.48 }, uIceN: { value: 40 }, uIceS: { value: 40 }, uIceNFI: { value: 20 }, uIceSFI: { value: 20 }, uEqDesert: { value: 30 }, uLandCluster: { value: 0 }, uCorePos: { value: new THREE.Vector3(0, 0, 1) } },
            vertexShader: `varying vec3 vPos, vN; void main() { vPos = position; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `${noiseShader} ${planetLogic} varying vec3 vPos, vN; uniform float uSeed, uSeaLevel, uIceN, uIceS, uIceNFI, uIceSFI, uEqDesert, uLandCluster; uniform vec3 uCorePos;
            void main() { vec3 p = normalize(vPos); vec3 c = getPlanetColor(p, uSeed, uSeaLevel, uIceN, uIceS, uIceNFI, uIceSFI, uEqDesert, uLandCluster, uCorePos); float light = max(dot(vN, normalize(vec3(1.0, 0.8, 1.0))), 0.0) * 0.8 + 0.2; gl_FragColor = vec4(c * light, 1.0); }`
        });

        const cMat = new THREE.ShaderMaterial({
            uniforms: { uSeed: { value: 40662 }, uCloud: { value: 0.5 } },
            vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position * 1.03, 1.0); }`,
            fragmentShader: `${noiseShader} varying vec3 vPos; uniform float uSeed, uCloud;
            void main() { vec4 sh = superHash(uSeed); float n = fbm(normalize(vPos) * 1.3 + sh.xyz + vec3(500.0), 5, sh.w) * 0.5 + 0.5; float alpha = smoothstep(1.0 - uCloud, 1.2 - uCloud, n) * 0.7; gl_FragColor = vec4(1.0, 1.0, 1.0, alpha); }`,
            transparent: true, depthWrite: false, blending: THREE.NormalBlending
        });

        const planet = new THREE.Mesh(new THREE.SphereGeometry(5, 128, 128), pMat);
        const clouds = new THREE.Mesh(new THREE.SphereGeometry(5, 128, 128), cMat);
        scene.add(planet);
        scene.add(clouds);

        // 星空背景
        const starsGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(3000 * 3);
        for (let i = 0; i < 3000 * 3; i += 3) {
            const r = 60 + Math.random() * 180;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPositions[i] = Math.sin(phi) * Math.cos(theta) * r;
            starPositions[i+1] = Math.sin(phi) * Math.sin(theta) * r;
            starPositions[i+2] = Math.cos(phi) * r;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.2, transparent: true})));

        // ---------- UI 同步逻辑 ----------
        const uiRanges = { sea: 'seaIn', cloud: 'cloudIn', eqDesert: 'eqDesertIn', iceN: 'iceNIn', iceS: 'iceSIn', iceNFI: 'iceNFlIn', iceSFI: 'iceSFlIn', landCluster: 'landClusterIn' };
        const uiNums = { sea: 'seaVal', cloud: 'cloudVal', eqDesert: 'eqDesertVal', iceN: 'iceNVal', iceS: 'iceSVal', iceNFI: 'iceNFlVal', iceSFI: 'iceSFlVal', landCluster: 'landClusterVal' };

        function syncFromUI() {
            const seed = parseFloat(document.getElementById('seedIn').value) || 40662;
            pMat.uniforms.uSeed.value = seed;
            cMat.uniforms.uSeed.value = seed;
            pMat.uniforms.uSeaLevel.value = parseFloat(document.getElementById('seaIn').value) / 100;
            cMat.uniforms.uCloud.value = parseFloat(document.getElementById('cloudIn').value) / 100;
            pMat.uniforms.uEqDesert.value = parseFloat(document.getElementById('eqDesertIn').value);
            pMat.uniforms.uIceN.value = parseFloat(document.getElementById('iceNIn').value);
            pMat.uniforms.uIceS.value = parseFloat(document.getElementById('iceSIn').value);
            pMat.uniforms.uIceNFI.value = parseFloat(document.getElementById('iceNFlIn').value);
            pMat.uniforms.uIceSFI.value = parseFloat(document.getElementById('iceSFlIn').value);
            pMat.uniforms.uLandCluster.value = parseFloat(document.getElementById('landClusterIn').value);
            pMat.uniforms.uCorePos.value = generateCorePos(seed);
        }

        for (const [key, rangeId] of Object.entries(uiRanges)) {
            const range = document.getElementById(rangeId);
            const num = document.getElementById(uiNums[key]);
            range.addEventListener('input', () => {
                num.value = range.value;
                syncFromUI();
            });
            num.addEventListener('input', () => {
                range.value = num.value;
                syncFromUI();
            });
        }
        document.getElementById('seedIn').addEventListener('input', syncFromUI);
        document.getElementById('btn-rand').onclick = () => {
            const v = Math.floor(Math.random() * 999999999999) + 1;
            document.getElementById('seedIn').value = v;
            syncFromUI();
        };

        // 导出功能 (精简封装，与之前相同)
        function getParams() {
            return {
                seed: document.getElementById('seedIn').value, sea: document.getElementById('seaIn').value,
                cloud: document.getElementById('cloudIn').value, eqDesert: document.getElementById('eqDesertIn').value,
                iceN: document.getElementById('iceNIn').value, iceS: document.getElementById('iceSIn').value,
                iceNFI: document.getElementById('iceNFlIn').value, iceSFI: document.getElementById('iceSFlIn').value,
                landCluster: document.getElementById('landClusterIn').value
            };
        }

        function doExport(mode) {
            const params = getParams();
            const W = 4096, H = 2048;
            const rt = new THREE.WebGLRenderTarget(W, H);
            const exMat = new THREE.ShaderMaterial({
                uniforms: {
                    uSeed: { value: pMat.uniforms.uSeed.value }, uSeaLevel: { value: pMat.uniforms.uSeaLevel.value },
                    uIceN: { value: pMat.uniforms.uIceN.value }, uIceS: { value: pMat.uniforms.uIceS.value },
                    uIceNFI: { value: pMat.uniforms.uIceNFI.value }, uIceSFI: { value: pMat.uniforms.uIceSFI.value },
                    uEqDesert: { value: pMat.uniforms.uEqDesert.value }, uLandCluster: { value: pMat.uniforms.uLandCluster.value },
                    uCorePos: { value: pMat.uniforms.uCorePos.value }, uCloud: { value: cMat.uniforms.uCloud.value }, uMode: { value: mode }
                },
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
                fragmentShader: `
                    ${noiseShader}
                    ${planetLogic}
                    varying vec2 vUv;
                    uniform float uSeed, uSeaLevel, uIceN, uIceS, uIceNFI, uIceSFI, uEqDesert, uCloud, uMode, uLandCluster;
                    uniform vec3 uCorePos;
                    vec3 getHeightMapColor(float h, float sl) {
                        if(h < sl) return mix(vec3(0,0,0.3), vec3(0,0.5,1), h/sl);
                        float lh = (h-sl)/(1.0-sl);
                        if(lh<0.1) return mix(vec3(0.1,0.6,0.2), vec3(0.5,0.8,0.3), lh/0.1);
                        if(lh<0.4) return mix(vec3(0.5,0.8,0.3), vec3(0.9,0.8,0.5), (lh-0.1)/0.3);
                        if(lh<0.8) return mix(vec3(0.9,0.8,0.5), vec3(0.4,0.2,0.1), (lh-0.4)/0.4);
                        return mix(vec3(0.4,0.2,0.1), vec3(1), (lh-0.8)/0.2);
                    }
                    void main() {
                        float lon = (vUv.x * 2.0 - 1.0) * 3.14159265;
                        float lat = (vUv.y * 2.0 - 1.0) * 1.57079632;
                        vec3 p = vec3(cos(lat) * sin(lon), sin(lat), cos(lat) * cos(lon));
                        float h = getH(p, uSeed, uLandCluster, uCorePos);
                        if (uMode == 0.0) {
                            gl_FragColor = vec4(getPlanetColor(p, uSeed, uSeaLevel, uIceN, uIceS, uIceNFI, uIceSFI, uEqDesert, uLandCluster, uCorePos), 1.0);
                        } else if (uMode == 1.0) {
                            vec4 sh = superHash(uSeed);
                            float n = fbm(p * 1.3 + sh.xyz + vec3(500.0), 6, sh.w) * 0.5 + 0.5;
                            gl_FragColor = vec4(1.0, 1.0, 1.0, smoothstep(1.0 - uCloud, 1.2 - uCloud, n));
                        } else if (uMode == 2.0) {
                            float eps = 0.001;
                            float hR = getH(vec3(cos(lat) * sin(lon + eps), sin(lat), cos(lat) * cos(lon + eps)), uSeed, uLandCluster, uCorePos);
                            float hU = getH(vec3(cos(lat + eps) * sin(lon), sin(lat + eps), cos(lat + eps) * cos(lon)), uSeed, uLandCluster, uCorePos);
                            vec3 normal = normalize(vec3((h - hR) * 25.0, (h - hU) * 25.0, 1.0));
                            gl_FragColor = vec4(normal * 0.5 + 0.5, 1.0);
                        } else if (uMode == 3.0) {
                            gl_FragColor = vec4(getHeightMapColor(h, uSeaLevel), 1.0);
                        } else if (uMode == 4.0) {
                            gl_FragColor = h >= uSeaLevel ? vec4(0.0, 0.0, 0.0, 1.0) : vec4(0.0, 0.0, 0.0, 0.0);
                        }
                    }
                `
            });
            const exScene = new THREE.Scene();
            const exCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            exScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), exMat));
            renderer.setRenderTarget(rt);
            renderer.render(exScene, exCam);
            const pixels = new Uint8Array(W * H * 4);
            renderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);
            const canvas = document.createElement('canvas');
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(W, H);
            imgData.data.set(pixels);
            ctx.putImageData(imgData, 0, 0);
            const flipped = document.createElement('canvas');
            flipped.width = W; flipped.height = H;
            const fctx = flipped.getContext('2d');
            fctx.translate(0, H); fctx.scale(1, -1); fctx.drawImage(canvas, 0, 0);
            const names = ['地形', '云层', '法线', '高度图', '陆地'];
            const a = document.createElement('a');
            a.download = `${names[mode]}_种子${params.seed}_海${params.sea}_云${params.cloud}_漠${params.eqDesert}_北冰${params.iceN}_南冰${params.iceS}_北浮${params.iceNFI}_南浮${params.iceSFI}_聚${params.landCluster}.png`;
            a.href = flipped.toDataURL();
            a.click();
            renderer.setRenderTarget(null);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        document.getElementById('btn-geo').onclick = () => doExport(0);
        document.getElementById('btn-cld').onclick = () => doExport(1);
        document.getElementById('btn-nor').onclick = () => doExport(2);
        document.getElementById('btn-hgt').onclick = () => doExport(3);
        document.getElementById('btn-land').onclick = () => doExport(4);

        // 动画循环 & 响应式
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function updateRendererSize() {
            const w = previewArea.clientWidth;
            const h = previewArea.clientHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', updateRendererSize);
        // 初始调用
        setTimeout(updateRendererSize, 10);
        syncFromUI();
    </script>
</body>
</html>
